<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBS Strategic Observation｜Loading</title>
<style>
html,body{margin:0;height:100%;font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f5f3ef;color:#26343d}.loading{height:100%;display:grid;place-items:center;text-align:center}.box{padding:28px 34px;border-radius:22px;background:#fff;box-shadow:0 18px 42px rgba(33,28,24,.10)}.mark{width:52px;height:52px;margin:0 auto 14px;background:#e2231a;transform:rotate(45deg);border-radius:12px;position:relative}.mark:after{content:"";position:absolute;inset:13px;background:#fff;border-radius:7px}.box b{display:block;font-size:18px}.box span{display:block;margin-top:6px;font-size:12px;color:#65717a}
</style>
</head>
<body>
<div class="loading"><div class="box"><div class="mark"></div><b>DBS Strategic Observation</b><span>Loading strategic observation...</span></div></div>
<script>
(async()=>{
  try{
    const files=Array.from({length:10},(_,i)=>`dbs-parts/part-${String(i).padStart(2,'0')}.txt`);
    const responses=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'})));
    for(const r of responses){if(!r.ok)throw new Error(`Failed to load ${r.url}: ${r.status}`)}
    const parts=await Promise.all(responses.map(r=>r.text()));
    const html=parts.join('');
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML=`<div class="loading"><div class="box"><b>Unable to load DBS report</b><span>${String(err)}</span></div></div>`;
  }
})();
</script>
</body>
</html>
