name: Publish DBS approved HTML once
on:
  push:
    paths:
      - '.github/workflows/publish-dbs-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download approved HTML
        run: |
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7b34-8211-9e3f-cb9ad0650975/raw?se=2026-10-29T07%3A28%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=04aeaf0a-4a20-569b-9c07-79debc715de7&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-28T21%3A55%3A29Z&ske=2026-10-29T21%3A55%3A29Z&sks=b&skv=2026-02-06&sig=iNZU9DnWvYwYa3Hzpc2fK/Vq8fFtua23MMsAttJoFh0%3D' -o DBS_Strategic_Observation.html
          test $(wc -c < DBS_Strategic_Observation.html) -eq 38094
      - name: Commit approved HTML
        run: |
          rm .github/workflows/publish-dbs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DBS_Strategic_Observation.html .github/workflows/publish-dbs-once.yml
          git commit -m 'Publish DBS Strategic Observation reference page'
          git push
